<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Self-hosted DevOps Platform</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5e7eb;

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 72px 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 42px;
        line-height: 1.08;
      }

      p {
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1.6;
      }

        color: #67e8f9;
      }

  <body>
    <main>
      <h1>Self-hosted DevOps Platform</h1>

      </p>
