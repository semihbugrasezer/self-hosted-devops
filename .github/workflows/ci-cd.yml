name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: devops-api

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            app/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Lint API code
        run: npm run lint

      - name: Run API tests
        run: npm test

      - name: Install dashboard dependencies
        working-directory: app
        run: npm ci

      - name: Build React dashboard
        working-directory: app
        run: npm run build

      - name: Build API Docker image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Build dashboard Docker image
        working-directory: .
        run: docker build -t devops-dashboard:${{ github.sha }} app

      - name: Validate Compose configuration
        working-directory: .
        run: docker compose config

      - name: Build sample deployable image
        working-directory: .
        run: docker build -t sample-service:${{ github.sha }} sample-service

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  trigger-deployment:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_WEBHOOK_URL }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_WEBHOOK_URL != ''
    steps:
      - name: Trigger deployment API
        run: |
          curl -fsS -X POST "${{ vars.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{
              "repo": "${{ github.server_url }}/${{ github.repository }}.git",
              "name": "devops-api",
              "domain": "api.localhost"
            }'
